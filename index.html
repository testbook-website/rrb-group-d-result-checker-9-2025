<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RRB Group D Result Checker Widget</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- Small Embeddable Widget Container -->
  <div class="widget-wrapper">
    <div class="result-widget">

      <!-- Widget Header -->
      <div class="widget-header">
        <div class="widget-title-row">
          <div class="widget-icon">🚆</div>
          <div>
            <h2 class="widget-title">RRB Group D Result</h2>
            <div class="widget-subtitle">CEN 09/2025 • CBT to PET Shortlist</div>
          </div>
        </div>
        <span class="live-tag">🟢 Bhopal Live</span>
      </div>

      <!-- Result Checker Form -->
      <form id="resultForm" class="widget-form">

        <!-- Zone Selection -->
        <div class="form-row">
          <label for="rrbZone" class="label">Select Zone</label>
          <select id="rrbZone" class="input select" required>
            <option value="Bhopal" selected>RRB Bhopal (Result Live)</option>
            <option value="Ahmedabad">RRB Ahmedabad (Awaited)</option>
            <option value="Ajmer">RRB Ajmer (Awaited)</option>
            <option value="Prayagraj">RRB Prayagraj / Allahabad (Awaited)</option>
            <option value="Bangalore">RRB Bangalore (Awaited)</option>
            <option value="Bhubaneswar">RRB Bhubaneswar (Awaited)</option>
            <option value="Bilaspur">RRB Bilaspur (Awaited)</option>
            <option value="Chandigarh">RRB Chandigarh (Awaited)</option>
            <option value="Chennai">RRB Chennai (Awaited)</option>
            <option value="Gorakhpur">RRB Gorakhpur (Awaited)</option>
            <option value="Guwahati">RRB Guwahati (Awaited)</option>
            <option value="Jammu-Srinagar">RRB Jammu-Srinagar (Awaited)</option>
            <option value="Kolkata">RRB Kolkata (Awaited)</option>
            <option value="Malda">RRB Malda (Awaited)</option>
            <option value="Mumbai">RRB Mumbai (Awaited)</option>
            <option value="Muzaffarpur">RRB Muzaffarpur (Awaited)</option>
            <option value="Patna">RRB Patna (Awaited)</option>
            <option value="Ranchi">RRB Ranchi (Awaited)</option>
            <option value="Secunderabad">RRB Secunderabad (Awaited)</option>
            <option value="Siliguri">RRB Siliguri (Awaited)</option>
            <option value="Thiruvananthapuram">RRB Thiruvananthapuram (Awaited)</option>
          </select>
        </div>

        <!-- Candidate Full Name -->
        <div class="form-row">
          <label for="candidateName" class="label">Full Name</label>
          <input type="text" id="candidateName" class="input" placeholder="Enter candidate name" required autocomplete="name">
        </div>

        <!-- Mobile Number -->
        <div class="form-row">
          <label for="mobileNumber" class="label">Mobile Number</label>
          <div class="phone-group">
            <span class="phone-code">+91</span>
            <input type="tel" id="mobileNumber" class="input phone-input" placeholder="10-digit number" maxlength="10" required autocomplete="tel">
          </div>
        </div>

        <!-- Roll Number -->
        <div class="form-row">
          <div class="label-with-action">
            <label for="rollNumber" class="label">Roll Number (15 digits)</label>
            <button type="button" id="btnSampleRoll" class="sample-link">Sample Roll</button>
          </div>
          <input type="text" id="rollNumber" class="input roll-input" placeholder="e.g. 159251120672095" maxlength="16" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnSubmit" class="submit-btn">
          <span id="btnSpinner" class="spinner"></span>
          <span id="btnText">Check Result</span>
        </button>

      </form>

      <!-- Embedded Result Output -->
      <div id="resultContainer" class="widget-result"></div>

      <!-- Compact Footer -->
      <div class="widget-footer">
        <a href="./Bhopal.pdf" download="RRB_Bhopal_Result.pdf" class="footer-link">Official Bhopal PDF</a>
        <span class="sep">•</span>
        <button type="button" id="btnOpenAdmin" class="admin-link">⚙️ Leads &amp; Sheet</button>
      </div>

    </div>
  </div>

  <!-- Admin Modal for Sheet / CSV -->
  <div id="adminModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Google Sheet &amp; Leads</h3>
        <button id="btnCloseAdmin" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="stat-row">
          <div class="stat-pill"><span id="statTotalLeads">0</span> Checks</div>
          <div class="stat-pill success"><span id="statQualifiedLeads">0</span> Qualified</div>
          <div class="stat-pill info"><span id="statAwaitedLeads">0</span> Alerts</div>
        </div>
        <div style="margin-top: 14px;">
          <button id="btnExportCsv" class="export-btn">📥 Download Leads CSV</button>
        </div>
        <div style="margin-top: 16px;">
          <label class="label">Google Sheet Webhook URL</label>
          <div style="display:flex; gap:6px; margin-top:4px;">
            <input type="url" id="adminWebhookUrl" class="input" style="font-size:0.8rem;">
            <button id="btnSaveWebhook" class="btn-sm">Save</button>
            <button id="btnTestWebhook" class="btn-sm btn-accent">Test</button>
          </div>
          <div id="webhookSaveStatus" style="font-size:0.75rem; min-height:16px; margin-top:4px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bhopal Database & Application Logic -->
  <script src="./bhopal_rolls.js"></script>
  <script src="./app.js"></script>

</body>
</html>
